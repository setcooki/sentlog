// @sentlog/capacitor — Android plugin module.
//
// Picked up by Capacitor at app build time via the consumer's
// `capacitor.config.json`. The plugin class itself
// (SentlogPlugin.kt) is registered via @CapacitorPlugin; Capacitor's
// gradle tooling adds this as a subproject and wires the consumer
// app's gradle to discover it.

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace "me.cooki.sentlog.capacitor"
    compileSdk 36

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    implementation "me.cooki.sentlog:sentlog:0.0.0"
}
